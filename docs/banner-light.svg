<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="'그럼 다음주 화요일 오후 3시에 볼까?' 에서 '다음주 화요일 오후 3시'를 찾아 2026-11-03 15:00 으로 바꾼다">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "D2Coding", monospace; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="219" rx="16" fill="#ffffff" stroke="#d0d7de"/>

  <!-- 입력 문장 -->
  <text x="40" y="52" font-size="13" fill="#57606a" letter-spacing="1">INPUT</text>
  <rect x="40" y="66" width="420" height="56" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="60" y="101" font-size="20" fill="#24292f">그럼 <tspan fill="#0969da" font-weight="700" text-decoration="underline">다음주 화요일 오후 3시</tspan>에 볼까?</text>

  <!-- 화살표 -->
  <path d="M482 94 H560" stroke="#8c959f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M552 86 L562 94 L552 102" stroke="#8c959f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="521" y="80" font-size="12" fill="#8c959f" text-anchor="middle" class="mono">parse()</text>

  <!-- 출력 -->
  <text x="584" y="52" font-size="13" fill="#57606a" letter-spacing="1">DATE</text>
  <rect x="584" y="66" width="256" height="56" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="604" y="101" font-size="20" fill="#1a7f37" font-weight="700" class="mono">2026-11-03 15:00</text>

  <!-- 하단 설명 -->
  <text x="40" y="172" font-size="15" fill="#57606a">기준 시각 2026-10-30 (금) 14:00 · 문장 중간에서 찾기 · 구간 · 구어체 · 런타임 의존성 0</text>
</svg>
