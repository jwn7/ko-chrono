name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 결과가 실행 환경의 시간대에 좌우되지 않는지 확인 (서울, UTC 서버, 서머타임이 있는 지역)
        tz: [Asia/Seoul, UTC, America/Los_Angeles]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # ESM과 CommonJS 둘 다 실제로 불러와지는지
      - run: node -e "const { parse } = require('./dist/cjs/index.js'); if (!parse('내일')) process.exit(1)"
      - run: node --input-type=module -e "import { parse } from './dist/index.js'; if (!parse('내일')) process.exit(1)"
